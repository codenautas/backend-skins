name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Check versions from tag and package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "Error: el tag ($GITHUB_REF) no coincide con package.json (v$VERSION)"
            exit 1
          fi
      - name: Publish to NPM
        run: npm publish --provenance
